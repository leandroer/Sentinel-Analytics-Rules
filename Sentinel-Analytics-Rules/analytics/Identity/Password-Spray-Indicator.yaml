id: 11111111-1111-1111-1111-111111111111
name: Password Spray Indicator - Multiple Users Failed From Same IP
description: |
  Detects a source IP address generating failed sign-ins against multiple users within a short time window.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1h
queryPeriod: 24h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  let Lookback = 24h;
  let UserThreshold = 15;
  SigninLogs
  | where TimeGenerated > ago(Lookback)
  | where ResultType != 0
  | summarize FailedUsers=dcount(UserPrincipalName), Users=make_set(UserPrincipalName, 100), Apps=make_set(AppDisplayName, 50)
      by IPAddress, bin(TimeGenerated, 30m)
  | where FailedUsers >= UserThreshold
  | extend DetectionName = "Password Spray Indicator"
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
version: 1.0.0
kind: Scheduled
