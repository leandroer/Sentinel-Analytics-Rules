id: dd645ee7-4418-56dd-b78c-e822b4fce3df
name: Azure storage public-access configuration changed
description: Detects successful control-plane operations that may enable public blob or container access.
severity: High
status: Available
requiredDataConnectors:
- connectorId: AzureActivity
  dataTypes:
  - AzureActivity
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
- Exfiltration
relevantTechniques:
- T1530
query: |
  AzureActivity | where TimeGenerated>ago(1h) and ActivityStatusValue =~ "Success"
  | where OperationNameValue has_any ("storageAccounts/write","blobServices/containers/write") and tostring(Properties) has_any ("allowBlobPublicAccess","publicAccess")
  | extend CallerUPN=tostring(Caller), SourceIP=tostring(CallerIpAddress), ResourceId=tostring(_ResourceId), ChangeDetails=tostring(Properties)
  | project TimeGenerated, CallerUPN, SourceIP, ResourceId, OperationNameValue, ChangeDetails, CorrelationId
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: CallerUPN
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIP
- entityType: AzureResource
  fieldMappings:
  - identifier: ResourceId
    columnName: ResourceId
customDetails:
  Operation: OperationNameValue
  CorrelationId: CorrelationId
alertDetailsOverride:
  alertDisplayNameFormat: Storage access changed by {{CallerUPN}}
  alertDescriptionFormat: Public-access-related settings changed on {{ResourceId}}.
eventGroupingSettings:
  aggregationKind: AlertPerResult
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities:
    - Account
    - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
