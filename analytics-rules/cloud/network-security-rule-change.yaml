id: a2181805-e88f-5b7c-888e-8fe1e70fd9a7
name: Azure network security rule changed
description: Detects successful creation or modification of NSG security rules.
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: AzureActivity
  dataTypes:
  - AzureActivity
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1562.004
query: |
  AzureActivity | where TimeGenerated>ago(1h) and ActivityStatusValue =~ "Success" and OperationNameValue has "MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/WRITE"
  | extend CallerUPN=tostring(Caller), SourceIP=tostring(CallerIpAddress), ResourceId=tostring(_ResourceId), ChangeDetails=tostring(Properties)
  | project TimeGenerated, CallerUPN, SourceIP, ResourceId, OperationNameValue, ChangeDetails, CorrelationId
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: CallerUPN
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIP
- entityType: AzureResource
  fieldMappings:
  - identifier: ResourceId
    columnName: ResourceId
customDetails:
  Operation: OperationNameValue
  CorrelationId: CorrelationId
alertDetailsOverride:
  alertDisplayNameFormat: Network security rule changed by {{CallerUPN}}
  alertDescriptionFormat: A security rule was changed on {{ResourceId}}.
eventGroupingSettings:
  aggregationKind: AlertPerResult
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities:
    - Account
    - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
