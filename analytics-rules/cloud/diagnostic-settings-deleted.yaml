id: 2342c949-9201-5ae5-9d57-7230c3ef377d
name: Azure diagnostic settings deleted
description: Detects successful deletion of Azure diagnostic settings that can reduce security visibility.
severity: High
status: Available
requiredDataConnectors:
- connectorId: AzureActivity
  dataTypes:
  - AzureActivity
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1562.008
query: |
  AzureActivity | where TimeGenerated>ago(1h) and OperationNameValue =~ "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE" and ActivityStatusValue =~ "Success"
  | extend CallerUPN=tostring(Caller), SourceIP=tostring(CallerIpAddress), ResourceId=tostring(_ResourceId)
  | project TimeGenerated, CallerUPN, SourceIP, ResourceId, ResourceGroup, SubscriptionId, CorrelationId, OperationNameValue
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: CallerUPN
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIP
- entityType: AzureResource
  fieldMappings:
  - identifier: ResourceId
    columnName: ResourceId
customDetails:
  CorrelationId: CorrelationId
  SubscriptionId: SubscriptionId
alertDetailsOverride:
  alertDisplayNameFormat: Diagnostics deleted by {{CallerUPN}}
  alertDescriptionFormat: Diagnostic settings were deleted from {{ResourceId}}.
eventGroupingSettings:
  aggregationKind: AlertPerResult
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities:
    - Account
    - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
