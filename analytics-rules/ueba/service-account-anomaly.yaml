id: a66cb7e5-61ed-5116-9d8b-b307c3ac1f2f
name: High-priority service-account anomaly
description: Correlates high-priority UEBA activity with service-account tags or naming patterns.
severity: High
status: Available
requiredDataConnectors:
- connectorId: BehaviorAnalytics
  dataTypes:
  - BehaviorAnalytics
  - IdentityInfo
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
- Persistence
relevantTechniques:
- T1078.004
query: |
  let Id=IdentityInfo | where TimeGenerated>ago(14d) | extend UPN=tostring(column_ifexists("AccountUPN","")), Tags=tostring(column_ifexists("AccountTags","")) | summarize arg_max(TimeGenerated,*) by UPN;
  BehaviorAnalytics | where TimeGenerated>ago(1h) and InvestigationPriority>=7 | join kind=inner Id on $left.UserPrincipalName==$right.UPN
  | where Tags has "ServiceAccount" or UserPrincipalName matches regex @"(?i)(svc|service|automation|bot)[-_.]"
  | extend SourceIP=SourceIPAddress, Reason=tostring(ActivityInsights)
  | project TimeGenerated, UserPrincipalName, SourceIP, SourceDevice, InvestigationPriority, ActivityType, Tags, Reason
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIP
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: SourceDevice
customDetails:
  Priority: InvestigationPriority
  ActivityType: ActivityType
  Tags: Tags
alertDetailsOverride:
  alertDisplayNameFormat: 'Service-account anomaly: {{UserPrincipalName}}'
  alertDescriptionFormat: '{{ActivityType}} received priority {{InvestigationPriority}}.'
eventGroupingSettings:
  aggregationKind: AlertPerResult
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities:
    - Account
    - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
