id: 69d04f67-ae44-5b27-b878-1e3743c212ed
name: Living-off-the-land binary used for retrieval
description: Detects Windows utilities executing with command-line patterns associated with remote retrieval.
severity: High
status: Available
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CommandAndControl
- Execution
relevantTechniques:
- T1105
- T1218
query: |
  DeviceProcessEvents | where Timestamp>ago(1h) and FileName in~ ("certutil.exe","bitsadmin.exe","curl.exe","mshta.exe") and ProcessCommandLine has_any ("http://","https://","urlcache","/transfer","javascript:")
  | extend TimeGenerated=Timestamp, AccountUPN=InitiatingProcessAccountUpn
  | project TimeGenerated, DeviceName, AccountUPN, FileName, ProcessCommandLine, InitiatingProcessFileName, SHA1
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: AccountUPN
- entityType: FileHash
  fieldMappings:
  - identifier: SHA1
    columnName: SHA1
customDetails:
  Process: FileName
  CommandLine: ProcessCommandLine
alertDetailsOverride:
  alertDisplayNameFormat: '{{FileName}} retrieved content on {{DeviceName}}'
  alertDescriptionFormat: A living-off-the-land utility used a retrieval pattern.
eventGroupingSettings:
  aggregationKind: AlertPerResult
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities:
    - Host
    - Account
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
