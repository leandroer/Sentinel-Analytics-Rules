id: 87129aec-2afc-5bfd-8ecd-7de2bd7f2800
name: Credential dumping command indicators
description: Detects process command lines associated with LSASS access, credential dumping, or common dump utilities.
severity: High
status: Available
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1003.001
query: |
  DeviceProcessEvents | where Timestamp>ago(1h)
  | where ProcessCommandLine has_any ("sekurlsa","lsass.dmp","comsvcs.dll","MiniDump","procdump")
  | extend TimeGenerated=Timestamp, AccountUPN=InitiatingProcessAccountUpn
  | project TimeGenerated, DeviceName, AccountUPN, FileName, ProcessCommandLine, InitiatingProcessFileName, SHA1
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: AccountUPN
- entityType: FileHash
  fieldMappings:
  - identifier: SHA1
    columnName: SHA1
customDetails:
  Process: FileName
  CommandLine: ProcessCommandLine
alertDetailsOverride:
  alertDisplayNameFormat: Credential dumping indicator on {{DeviceName}}
  alertDescriptionFormat: '{{FileName}} executed with a credential-access pattern.'
eventGroupingSettings:
  aggregationKind: AlertPerResult
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities:
    - Host
    - Account
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
