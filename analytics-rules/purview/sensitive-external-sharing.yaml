id: 88fbcfa8-58d8-5de7-88f3-7aa636f602f0
name: Sensitive file shared externally
description: Detects external sharing operations for files carrying configured sensitivity labels. Adapt label fields to the tenant schema.
severity: High
status: Available
requiredDataConnectors:
- connectorId: Office365
  dataTypes:
  - OfficeActivity
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- Exfiltration
relevantTechniques:
- T1567
query: |
  OfficeActivity | where TimeGenerated>ago(1h) and Workload in ("SharePoint","OneDrive") and Operation in ("SharingInvitationCreated","AnonymousLinkCreated","SecureLinkCreated")
  | extend UserPrincipalName=tostring(UserId), SourceIP=tostring(ClientIP), FileName=tostring(SourceFileName), SiteUrl=tostring(Site_Url), SensitivityLabel=tostring(column_ifexists("SensitivityLabel","")), TargetUser=tostring(column_ifexists("TargetUserOrGroupName",""))
  | where SensitivityLabel in~ ("Confidential","Highly Confidential","Restricted")
  | project TimeGenerated, UserPrincipalName, SourceIP, Operation, FileName, SiteUrl, SensitivityLabel, TargetUser
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIP
customDetails:
  FileName: FileName
  SensitivityLabel: SensitivityLabel
  TargetUser: TargetUser
alertDetailsOverride:
  alertDisplayNameFormat: Sensitive file shared by {{UserPrincipalName}}
  alertDescriptionFormat: '{{FileName}} labeled {{SensitivityLabel}} was shared externally.'
eventGroupingSettings:
  aggregationKind: AlertPerResult
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities:
    - Account
    - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
